server:
  port: 8081

spring:
  application:
    name: wallet-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/walletdb}
    username: ${SPRING_DATASOURCE_USERNAME:cryptopulse}
    password: ${SPRING_DATASOURCE_PASSWORD:cryptopulse}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: wallet-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

wallet:
  kafka:
    topic: wallet-events
    user-topic: user-events
    order-events-topic: order-events
    order-cancellations-topic: order-cancellations
  trading:
    supported-tickers: ${MARKET_SYMBOLS:BTCUSDT,ETHUSDT,SOLUSDT,ADAUSDT}

management:
  endpoints:
    web:
      exposure:
        include: health,info
