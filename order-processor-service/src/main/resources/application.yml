server:
  port: 8084

spring:
  application:
    name: order-processor-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-processor-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

order-processor:
  kafka:
    wallet-events-topic: wallet-events
    market-prices-topic: market-prices
    order-events-topic: order-events
    order-cancellations-topic: order-cancellations
  sync:
    initial-delay-ms: 1000
    pending-orders-interval-ms: 5000

wallet-service:
  url: ${WALLET_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
